services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legiscore}
      POSTGRES_USER: ${POSTGRES_USER:-legiscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT:-}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID:-}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://legiscore:change-me-locally@postgres:5432/legiscore?schema=public}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT:-}
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID:-}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:-}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:-}
      APPWRITE_LEGISLATION_COLLECTION_ID: ${APPWRITE_LEGISLATION_COLLECTION_ID:-}
      APPWRITE_LEGISLATORS_COLLECTION_ID: ${APPWRITE_LEGISLATORS_COLLECTION_ID:-}
      APPWRITE_STORAGE_BUCKET_ID: ${APPWRITE_STORAGE_BUCKET_ID:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
